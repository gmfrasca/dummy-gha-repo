name: Top Secret Test

on:
  workflow_dispatch:
jobs:
  top-secret-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Top Secret test
    steps:
      - name: Check Secret
        env:
          TOP_SECRET: ${{ secrets.FOO_SECRET }}
        if: ${{ env.TOP_SECRET != '' }}
        run:
          echo ${{ secrets.FOO_SECRET }}
